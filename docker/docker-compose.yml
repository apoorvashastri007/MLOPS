version: '3.8'

services:
  # 1. PostgreSQL Relational Data Warehouse
  postgres-dw:
    image: postgres:15-alpine
    container_name: student_postgres_dw
    environment:
      POSTGRES_DB: student_analytics
      POSTGRES_USER: analytics_admin
      POSTGRES_PASSWORD: admin_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_admin -d student_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI MLOps Prediction Microservice
  prediction-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: student_prediction_api
    depends_on:
      postgres-dw:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://analytics_admin:admin_secure_password_2026@postgres-dw:5432/student_analytics
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    restart: on-failure

  # 3. Streamlit Academic Analytics Dashboard
  analytics-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: student_streamlit_dashboard
    depends_on:
      - prediction-api
    environment:
      DATABASE_URL: postgresql://analytics_admin:admin_secure_password_2026@postgres-dw:5432/student_analytics
      FASTAPI_URL: http://prediction-api:8000
    ports:
      - "8501:8501"
    restart: on-failure

volumes:
  postgres_dw_data:
